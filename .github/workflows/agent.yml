name: Agent tests and packages

on:
  push:
    branches: ["**"]
    tags: ["agent-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_test_failures:
        description: "Build test artifacts despite failing tests (never create a release)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Linux desktop and build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-gi gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 libgirepository-1.0-1 xvfb xauth \
            dbus-x11 desktop-file-utils
          /usr/bin/python3 -m venv --system-site-packages .venv
      - name: Create Windows environment
        if: runner.os == 'Windows'
        run: python -m venv .venv
      - name: Select build environment
        run: |
          $bin = if ($IsWindows) { "Scripts" } else { "bin" }
          Join-Path $env:GITHUB_WORKSPACE ".venv" $bin | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m ruff check agent schemas addon
      - run: python -m ruff format --check agent schemas addon
      - name: Type check with build environment
        run: |
          $python = python -c "import sys; print(sys.executable)"
          & $python -m pyright --pythonpath $python
      - name: Test Windows including UI
        id: windows_tests
        if: runner.os == 'Windows'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_test_failures }}
        env:
          GADDHUB_UI_TEST: "1"
        run: python -m pytest agent/tests addon/tests -q
      - name: Test Linux including UI under Xvfb
        id: linux_tests
        if: runner.os == 'Linux'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_test_failures }}
        shell: bash
        env:
          GADDHUB_UI_TEST: "1"
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a python -m pytest agent/tests addon/tests -q
      - name: Build native package
        run: python -m PyInstaller --noconfirm --clean agent/GaddHub.spec
      - name: Smoke test packaged executable without display
        id: smoke_tests
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_test_failures }}
        run: |
          $exe = if ($IsWindows) { ".\dist\GaddHub\GaddHub.exe" } else { "./dist/GaddHub/GaddHub" }
          Remove-Item Env:DISPLAY -ErrorAction SilentlyContinue
          Remove-Item Env:WAYLAND_DISPLAY -ErrorAction SilentlyContinue
          if ($IsWindows) {
            $exitCode = (Start-Process -FilePath $exe -ArgumentList "--check-export", "agent/tests/fixtures/synthetic-savedvariables.lua" -Wait -PassThru).ExitCode
          } else {
            & $exe --check-export agent/tests/fixtures/synthetic-savedvariables.lua
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -ne 0) { throw "Packaged export validation failed (exit code: $exitCode)" }
          if ($IsWindows) {
            $exitCode = (Start-Process -FilePath $exe -ArgumentList "--check-export", "missing-export.lua" -Wait -PassThru).ExitCode
          } else {
            & $exe --check-export missing-export.lua
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -ne 1) { throw "Packaged invalid export was not rejected (exit code: $exitCode)" }
      - name: Archive Windows package
        if: runner.os == 'Windows'
        run: Compress-Archive -LiteralPath dist/GaddHub -DestinationPath dist/GaddHub-windows-x64.zip
      - name: Archive test addon
        if: runner.os == 'Windows'
        run: |
          $match = Select-String -LiteralPath addon/GaddHub/GaddHub.toc -Pattern '^## Version: ([0-9.]+)$'
          $version = $match.Matches[0].Groups[1].Value
          if (-not $version) { throw "Missing addon version" }
          Compress-Archive -LiteralPath addon/GaddHub -DestinationPath "dist/GaddHub-addon-$version.zip"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          & .\agent\installer\build.ps1 -Python (Get-Command python).Source -Compiler $compiler
      - name: Test Windows install, upgrade and uninstall
        id: installer_tests
        if: runner.os == 'Windows'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_test_failures }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter "GaddHub-Setup-*-windows-x64.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one installer" }
          $env:GADDHUB_INSTALLER = $installers[0].FullName
          python -m pytest agent/tests/test_installer.py -q
      - name: Archive Linux package preserving executable permissions
        if: runner.os == 'Linux'
        run: tar -czf dist/GaddHub-linux-x64.tar.gz -C dist GaddHub
      - name: Report manual test build results
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.allow_test_failures }}
        env:
          WINDOWS_TESTS: ${{ steps.windows_tests.outcome }}
          LINUX_TESTS: ${{ steps.linux_tests.outcome }}
          SMOKE_TESTS: ${{ steps.smoke_tests.outcome }}
          INSTALLER_TESTS: ${{ steps.installer_tests.outcome }}
        run: |
          Write-Output "::warning::Manual test build: test failures do not block artifacts. Release publishing is disabled."
          @(
            "## Manual test build - ${{ matrix.platform }}"
            "These artifacts are for testing only, not for release."
            ""
            "| Test step | Result |"
            "| --- | --- |"
            "| Windows tests | $env:WINDOWS_TESTS |"
            "| Linux tests | $env:LINUX_TESTS |"
            "| Packaged smoke tests | $env:SMOKE_TESTS |"
            "| Windows installer tests | $env:INSTALLER_TESTS |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: GaddHub-${{ matrix.platform }}${{ github.event_name == 'workflow_dispatch' && inputs.allow_test_failures && '-test-build' || '' }}
          path: |
            dist/GaddHub-*.zip
            dist/GaddHub-*.tar.gz
            dist/GaddHub-Setup-*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GaddHub-*
          merge-multiple: true
          path: packages
      - name: Create draft release with native packages and Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd packages && sha256sum GaddHub-* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" packages/* \
            --verify-tag --draft --generate-notes --title "GaddHub $GITHUB_REF_NAME"
